services:
  postgres:
    image: postgres:16-alpine
    container_name: systemlife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: systemlife
      POSTGRES_USER: systemlife
      POSTGRES_PASSWORD: systemlife
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
